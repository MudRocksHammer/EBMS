name: Post management tests

on:
    push:
        branches: [main, ci/post-tests]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Set up Java
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
                  cache-dependency-path: post-management/pom.xml

            - name: Run tests
              working-directory: post-management
              run: mvn -B --no-transfer-progress clean test
